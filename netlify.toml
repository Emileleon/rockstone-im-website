# Configuration de déploiement Netlify — Rockstone IM (Next.js)
[build]
  command = "npm run build"
  publish = ".next"

# Le plugin officiel gère le rendu Next.js (SSR, routes, images, etc.)
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  # Next.js 16 / React 19 nécessitent Node 20+
  NODE_VERSION = "22"
